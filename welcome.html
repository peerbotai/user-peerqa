<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to PeerQA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: white;
        }

        h1 {
            color: #1a202c;
            margin-bottom: 0.5rem;
            font-size: 2.5rem;
        }

        .subtitle {
            color: #718096;
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
        }

        .button {
            display: block;
            width: 100%;
            padding: 1rem 2rem;
            margin-bottom: 1rem;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .login-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(102, 126, 234, 0.5);
        }

        .demo-btn {
            background: #f7fafc;
            color: #4a5568;
            border: 2px solid #e2e8f0;
        }

        .demo-btn:hover {
            background: #edf2f7;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.1);
        }

        .divider {
            margin: 2rem 0;
            color: #a0aec0;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .features {
            margin-top: 2.5rem;
            padding-top: 2.5rem;
            border-top: 1px solid #e2e8f0;
        }

        .feature-list {
            display: flex;
            justify-content: space-around;
            gap: 1rem;
        }

        .feature {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .feature-icon {
            width: 40px;
            height: 40px;
            background: #f7fafc;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .feature-text {
            color: #718096;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🚀</div>
        <h1>Welcome to PeerQA</h1>
        <p class="subtitle">Your intelligent Q&A platform for peer learning</p>

        <button class="button login-btn" onclick="window.location.href='/login'">
            Sign In to Your Account
        </button>

        <div class="divider">OR</div>

        <button class="button demo-btn" onclick="window.location.href='/demo'">
            Try Live Demo
        </button>

        <div class="features">
            <div class="feature-list">
                <div class="feature">
                    <div class="feature-icon">💬</div>
                    <span class="feature-text">Ask & Answer</span>
                </div>
                <div class="feature">
                    <div class="feature-icon">🤝</div>
                    <span class="feature-text">Collaborate</span>
                </div>
                <div class="feature">
                    <div class="feature-icon">📊</div>
                    <span class="feature-text">Learn Together</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
